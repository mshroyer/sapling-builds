name: fbthrift
on:
  workflow_dispatch:
  schedule:
    - cron: "10 17 3 * *"

permissions:
  contents: read

jobs:
  fbthrift-el10:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-latest
            arch: arm64

    steps:
      - uses: actions/checkout@v5

      - name: Build fbthrift tarball
        run: ./scripts/build-fbthrift.sh

      - name: Try fbthrift tarball
        run: ./scripts/try-fbthrift.sh

      - name: Get artifact name
        id: artifact_name
        run: |
          set -e

          name="$(basename "$(find ./artifacts -name '*.tar.xz' | head -n1)")"
          name="${name%.tar.xz}"
          echo "name=$name" >>"$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_name.outputs.name }}
          path: artifacts/fbthrift-*.tar.xz
