name: sapling
on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'The Sapling commit to build'
        required: false
  schedule:
    - cron: "18 22 * * *"

permissions:
  contents: read

jobs:
  sapling:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        distro: [el10, fc44, ub2604]
        os: [ubuntu-26.04, ubuntu-26.04-arm]

    steps:
      - uses: actions/checkout@v5

      # - name: Fetch fbthrift
      #   env:
      #     GH_TOKEN: ${{ github.token }}
      #   run: ./scripts/fbthrift-fetch.sh

      - name: Build sapling package
        run: |
          ./scripts/sapling-build.sh \
              -d ${{ matrix.distro }} \
              ${{ inputs.commit || 'main' }}

      - name: Smoketest sapling package
        run: ./scripts/sapling-smoketest.sh -d ${{ matrix.distro }}

      - name: Get artifact name
        id: artifact_name
        run: |
          set -e

          name="$(basename "$(find ./artifacts -name '*.rpm' -or -name '*.deb' | head -n1)")"
          echo "name=$name" >>"$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact_name.outputs.name }}
          path: artifacts/sapling-*
