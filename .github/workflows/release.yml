name: release
on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Sapling commit to build'
        required: true

permissions:
  contents: read

jobs:
  sapling:
    uses: ./.github/workflows/sapling.yml
    with:
      commit: ${{ inputs.commit }}
      test: true

  release:
    needs: sapling
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Identify Sapling version
        id: version
        run: |
          set -e

          version=
          sapling_commit=
          for pkg in ./artifacts/sapling-*.rpm ./artifacts/sapling-*.deb; do
            [ -f "$pkg" ] || continue

            # A package is named like
            # sapling-0.2-20260824_111047+cf549e7d.ub2604.x86_64.deb, whose
            # version-release is the Sapling version string with the
            # separators RPM disallows substituted in.  Undo that to recover
            # the version as `sl --version` reports it.
            verrel="$(basename "$pkg")"
            verrel="${verrel#sapling-}"
            verrel="${verrel%.*.*.*}"
            v="$(printf '%s' "$verrel" | sed -E \
                's/^([0-9]+\.[0-9]+)-([0-9]+)_([0-9]+)\+([0-9a-f]+)(_b[0-9]+)?$/\1.\2-\3+\4\5/; s/_b/-b/')"
            if [ "$v" = "$verrel" ]; then
              echo "Unexpected package name: $pkg" >&2
              exit 1
            fi

            # The commit the package was actually built from, which need not
            # be the input if that was a branch name.
            c="${verrel##*+}"
            c="${c%%_b*}"

            if [ -z "$version" ]; then
              version="$v"
              sapling_commit="$c"
            elif [ "$v" != "$version" ]; then
              echo "Packages disagree on version: $version vs $v (from $pkg)" >&2
              exit 1
            fi
          done

          if [ -z "$version" ]; then
            echo "No sapling packages were downloaded!" >&2
            exit 1
          fi

          echo "Releasing Sapling $version"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "sapling_commit=$sapling_commit" >>"$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SAPLING_COMMIT: ${{ steps.version.outputs.sapling_commit }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -e

          cat >notes.md <<EOF
          Unofficial Sapling packages built from [facebook/sapling@${SAPLING_COMMIT}](https://github.com/facebook/sapling/commit/${SAPLING_COMMIT}), with Sapling's \`.t\` suite run against each build.  See [the workflow run](${RUN_URL}) for build and test logs.

          The Ubuntu 26.04 DEB depends on \`libpython3.12\` from the [deadsnakes PPA](https://launchpad.net/~deadsnakes/+archive/ubuntu/ppa), which must be enabled before installing it.
          EOF

          gh release create "$VERSION" \
              --draft \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$VERSION" \
              --notes-file notes.md \
              ./artifacts/sapling-*.rpm ./artifacts/sapling-*.deb
